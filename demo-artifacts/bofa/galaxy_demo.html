<html lang="en">
<head>
<meta charset="utf-8">
<title>Semantic Galaxy — demonstration retail-banking codebase (Spring Boot)</title>
<style>
  :root{
    --paper:#f2ece0; --paper2:#e8e0d0; --ink:#2b2721; --ink-soft:#6d6455;
    --panel:rgba(255,252,245,.93); --line:rgba(43,39,33,.35); --accent:#2d5f7a;
  }
  body.dark{
    --paper:#15171a; --paper2:#0e1013; --ink:#e6e0d4; --ink-soft:#9a9282;
    --panel:rgba(24,26,30,.93); --line:rgba(230,224,212,.32); --accent:#7fb6d6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
    font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;color:var(--ink)}
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
  .ui{position:absolute;z-index:2;font-size:11px;line-height:1.5}
  #title{top:14px;left:16px;max-width:420px}
  #title h1{font-size:13px;margin:0 0 4px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  #title p{margin:0;color:var(--ink-soft);font-size:10.5px}
  #counter{top:14px;left:16px}
  #controls{top:14px;right:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  button{font:inherit;font-size:10.5px;letter-spacing:.04em;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:2px;padding:5px 9px;cursor:pointer;min-width:168px;text-align:left}
  button:hover{border-color:var(--ink)}
  button.on{background:var(--ink);color:var(--paper)}
  #stats{position:absolute;left:16px;bottom:14px;color:var(--ink-soft);font-size:10px;line-height:1.7}
  #legend{position:absolute;right:16px;bottom:14px;color:var(--ink-soft);font-size:10px;line-height:1.7;text-align:right}
  #panel{position:absolute;right:16px;top:172px;width:310px;max-height:62vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:3px;padding:12px 13px;display:none;font-size:10.5px;line-height:1.55}
  #panel h2{margin:0 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
  #panel .sub{color:var(--ink-soft);margin:0 0 9px}
  #panel .f{border-top:1px dashed var(--line);padding-top:7px;margin-top:7px}
  #panel .sev{display:inline-block;padding:0 5px;border-radius:2px;color:#fff;font-size:9.5px;letter-spacing:.08em}
  .sev.critical{background:#a3232b}.sev.medium{background:#b8791f}.sev.high{background:#c2542a}.sev.low{background:#6b7a52}
  .sev.fixed{background:#2f7a52}
  #panel{overflow-x:hidden}
  #panel code{color:var(--ink-soft);overflow-wrap:anywhere;word-break:break-word}
  #panel .pr{margin-top:6px;font-weight:600}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;color:var(--ink-soft);font-size:10px}
  #banner{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;background:var(--panel);
    border:1px dashed var(--line);padding:5px 12px;font-size:10.5px;display:none;letter-spacing:.04em}
</style>
</head>

lying toUsername and amount; the browser is the only place any input shaping happens.","files":[{"path":"src/main/resources/templates/dashboard.html","lines":"1-198"}]},{"id":"view-login","name":"login.html","description":"Credential entry form posting to the security filter chain.","files":[{"path":"src/main/resources/templates/login.html","lines":"1-131"}]},{"id":"view-register","name":"register.html","description":"Public registration form, the attacker's entry point for obtaining a principal.","files":[{"path":"src/main/resources/templates/register.html","lines":"1-131"}]},{"id":"view-transactions","name":"transactions.html","description":"Renders the account's ledger rows.","files":[{"path":"src/main/resources/templates/transactions.html","lines":"1-133"}]}]},{"id":"build","name":"Build & Dependency Supply Chain","description":"Maven build definition and the third-party components it resolves \u2014 the surface a software-composition scan reads.","files":[{"path":"pom.xml","lines":"1-90"}],"children":[{"id":"build-parent","name":"Spring Boot parent","description":"spring-boot-starter-parent pin that transitively fixes the Spring Framework version used at runtime.","files":[{"path":"pom.xml","lines":"5-10"}]},{"id":"build-starters","name":"Framework starters","description":"Web, Security, Data JPA and Thymeleaf starters providing the MVC, authentication and ORM runtimes.","files":[{"path":"pom.xml","lines":"20-53"}]},{"id":"build-mysql","name":"MySQL connector pin","description":"Direct dependency pin on the legacy mysql-connector-java coordinate, whose fix ships only under a relocated artifact.","files":[{"path":"pom.xml","lines":"54-59"}]},{"id":"build-plugins","name":"Build plugins","description":"Spring Boot Maven plugin and compiler configuration targeting Java 17.","files":[{"path":"pom.xml","lines":"60-90"}]},{"id":"build-tests","name":"Test suite","description":"A single Spring context-load test; no behavioural coverage of the money-movement paths.","fil const FINDINGS = {"scan_label":"Security Swarm scan of a demonstration retail-banking codebase (Spring Boot)","findings":[{"path":"src/main/java/com/example/bankapp/service/AccountService.java","line":103,"severity":"critical","title":"Negative transfer amount allows stealing funds from any account","description":"transferAmount() guards with balance.compareTo(amount) < 0, which always passes for a negative amount. An authenticated user posting amount=-100 to /transfer credits themselves 100 and debits the named victim 100. Entry point is BankController.java:82-96; the sink is AccountService.java:103-117. The same missing check also lets a negative withdrawal (AccountService.java:64-69) credit the caller.","remediated":false,"pr_label":"PR: #298 (private demonstration repository)","pr_note":"Open, not merged, so this finding still counts as open."},{"path":"src/main/java/com/example/bankapp/config/SecurityConfig.java","line":28,"severity":"medium","title":"CSRF protection disabled on session-authenticated money-moving forms","description":"The filter chain disables CSRF while using cookie-backed form login, so deposit, withdraw and transfer POSTs can be driven cross-site from a victim's authenticated browser session.","remediated":false},{"path":"docker-compose.yml","line":7,"severity":"medium","title":"Hardcoded database credentials committed to source","description":"The database root password is committed in plaintext and replicated across application.properties, the Kubernetes secret manifest (base64 encoding, not encryption) and the Helm values file. Classified as secrets hygiene rather than a live credential compromise.","remediated":false},{"path":"pom.xml","line":54,"severity":"medium","title":"Vulnerable MySQL Connector/J 8.0.33 (CVE-2023-22102)","description":"The build pins the legacy mysql-connector-java coordinate at 8.0.33, affected by a takeover advisory. The fix ships only under the relocated com.mysql:mysql-connector-j artifact, so a version bump al   ],
  remediation: "PR: #298 (private demonstration repository)",
  remediationNote: "Service-layer positive-amount validation plus Mockito tests. Open, not merged, so it still counts as open here."
};
const SEV_W = {critical:8, high:4, medium:2, low:1};

/* ---------- deterministic prng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

/* ---------- build graph ---------- */
const nodes=[], nodeById={}, clusters=[];
(function build(){
  const rnd=mulberry32(20260906);
  const N=INDEX.clusters.length;
  INDEX.clusters.forEach((cl,i)=>{
    // fibonacci sphere for cluster centres -> deterministic, well spread
    const k=i+0.5, phi=Math.acos(1-2*k/N), theta=Math.PI*(1+Math.sqrt(5))*k;
    const R=330+rnd()*40;
    const c={id:cl.id,name:cl.name,desc:cl.description,files:cl.files||[],isCluster:true,
      x:R*Math.cos(theta)*Math.sin(phi), y:R*Math.sin(theta)*Math.sin(phi)*0.72, z:R*Math.cos(phi),
      children:[],findings:[],weight:0,r:15};
    nodes.push(c); nodeById[c.id]=c; clusters.push(c);
    const kids=cl.children||[], m=kids.length;
    kids.forEach((ch,j)=>{
      const rr=mulberry32(hash(ch.id));
      const a=(j/m)*Math.PI*2 + (i*0.7);
      const orb=88+rr()*34, tilt=(rr()-0.5)*1.1;
      const n={id:ch.id,name:ch.name,desc:ch.description,files:ch.files||[],isCluster:false,parent:c,
        x:c.x+Math.cos(a)*orb, y:c.y+Math.sin(a)*orb*0.55+tilt*30, z:c.z+Math.sin(a)*orb*0.8+tilt*22,
        findings:[],weight:0,r:9,seed:rr()};
      nodes.push(n); nodeById[n.id]=n; c.children.push(n);
    });
  });
})();

/* attribute findings to the most specific node matching the path */
let unattributed=0;
FINDINGS.findings.forEach(f=>{
  let best=null,bestScore=-1;
  nodes.forEach(n=>{
    if(n.isCluster) return;
    (n.files||[]).forEach(fl=>{
      if(fl.path!==f.path) return;
      let score=1;
      if(fl.lines){const [a,b]=fl.lines.split("-").map(Number); if(f.line>=a&&f.line<=b) score=3;}
      if(score>bestScore){bestScore=score;best=n;}
    });
  });
  if(!best){ clusters.forEach(c=>{ (c.files||[]).forEach(fl=>{ if(fl.path===f.path && bestScore<0){best=c;bestScore=0;} }); }); }
  if(best){ best.findings.push(f); }
  else unattributed++;
});
nodes.forEach(n=>{ n.weight=n.findings.reduce((s,f)=>s+(SEV_W[f.severity]||1),0);
  if(n.parent) n.parent.weight+=0; });
clusters.forEach(c=>{ c.childWeight=c.children.reduce((s,n)=>s+n.weight,0)+c.weight; });

/* relations */
const relEdges=INDEX.relations.map(r=>({a:nodeById[r.from],b:nodeById[r.to],kind:r.kind,label:r.label})).filter(e=>e.a&&e.b);
const totalFindings=FINDINGS.findings.length;
const openCount=()=>state.previewFix?0:FINDINGS.findings.filter(f=>!f.remediated).length;
const fixedCount=()=>state.previewFix?totalFindings:FINDINGS.findings.filter(f=>f.remediated).length;

/* ---------- state ---------- */
const state={yaw:0.6,pitch:-0.22,zoom:1,tYaw:0.6,tPitch:-0.22,tZoom:1,
  cx:0,cy:0,cz:0,tcx:0,tcy:0,tcz:0,
  selected:null,hover:null,dark:false,previewFix:false,
  replayStart:0,chainStart:0,chainOn:false,dragging:false,lx:0,ly:0};

const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener("resize",resize);resize();

function project(n){
  const dx=n.x-state.cx, dy=n.y-state.cy, dz=n.z-state.cz;
  const cy=Math.cos(state.yaw),sy=Math.sin(state.yaw);
  let x=dx*cy - dz*sy, z=dx*sy + dz*cy;
  const cp=Math.cos(state.pitch),sp=Math.sin(state.pitch);
  let y=dy*cp - z*sp; z=dy*sp + z*cp;
  const d=900, s=d/(d+z)*state.zoom;
  return {sx:W/2+x*s, sy:H/2+y*s, s:s, z:z};
}
function css(v){return getComputedStyle(document.body).getPropertyValue(v).trim();}
/* screen rectangles occupied by HTML chrome, so canvas labels can steer clear */
function uiBoxes(){
  return ["title","controls","panel","stats","legend","hint","banner"].map(id=>{
    const el=document.getElementById(id);
    if(!el||el.offsetParent===null) return null;
    const r=el.getBoundingClientRect();
    return r.width?{left:r.left,right:r.right,top:r.top,bottom:r.bottom}:null;
  }).filter(Boolean);
}

/* ---------- drawing helpers ---------- */
function wobbleLine(x1,y1,x2,y2,seed,alpha,dash){
  const r=mulberry32(seed);
  ctx.save(); ctx.globalAlpha=alpha; ctx.setLineDash(dash?[5,5]:[]);
  for(let pass=0;pass<2;pass++){
    const off=pass===0?0:1.1;
    ctx.beginPath();
    const mx=(x1+x2)/2+(r()-0.5)*6, my=(y1+y2)/2+(r()-0.5)*6;
    ctx.moveTo(x1+off*0.4,y1+off);
    ctx.quadraticCurveTo(mx+off*0.4,my+off,x2+off*0.4,y2+off);
    ctx.globalAlpha=alpha*(pass===0?1:0.45);
    ctx.stroke();
  }
  ctx.restore();
}
function hatchNode(n,p,alpha,fill){
  const r=n.isCluster?n.r*1.5:n.r, R=Math.max(3.2,r*p.s);
  const sides=n.isCluster?6:5, rot=(n.seed||0.3)*Math.PI;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.beginPath();
  for(let i=0;i<sides;i++){const a=rot+i/sides*Math.PI*2;
    const px=p.sx+Math.cos(a)*R, py=p.sy+Math.sin(a)*R;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.globalAlpha=alpha*0.5; ctx.lineWidth=0.7;
  for(let i=-R*2;i<R*2;i+=3.4){ctx.beginPath();ctx.moveTo(p.sx-R+i,p.sy-R);ctx.lineTo(p.sx+R+i,p.sy+R);ctx.stroke();}
  ctx.restore();
  ctx.globalAlpha=alpha; ctx.lineWidth=n.isCluster?1.3:0.9; ctx.stroke();
  ctx.restore();
}
function heat(n,p,alpha){
  const w=n.weight; if(!w) return;
  const R=Math.max(20,(14+w*6.2)*p.s);
  const fixed=state.previewFix||n.findings.every(f=>f.remediated);
  const g=ctx.createRadialGradient(p.sx,p.sy,0,p.sx,p.sy,R);
  const hue=fixed?"47,140,86":"178,32,40";
  const peak=Math.min(0.5,0.16+w*0.045)*alpha;
  g.addColorStop(0,`rgba(${hue},${peak})`); g.addColorStop(0.55,`rgba(${hue},${peak*0.38})`); g.addColorStop(1,`rgba(${hue},0)`);
  ctx.save();ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.sx,p.sy,R,0,7);ctx.fill();ctx.restore();
}
function label(text,x,y,alpha,size,weight,align){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.font=`${weight||400} ${size||10.5}px ui-monospace,Menlo,Consolas,monospace`;
  ctx.textAlign=align||"left";ctx.textBaseline="middle";
  ctx.lineWidth=3;ctx.strokeStyle=css("--paper");ctx.strokeText(text,x,y);
  ctx.fillStyle=css("--ink");ctx.fillText(text,x,y);ctx.restore();
}

/* ---------- interaction ---------- */
cv.addEventListener("mousedown",e=>{state.dragging=true;state.lx=e.clientX;state.ly=e.clientY;});
window.addEventListener("mouseup",()=>{state.dragging=false;});
window.addEventListener("mousemove",e=>{
  if(state.dragging){state.tYaw+=(e.clientX-state.lx)*0.006;state.tPitch+=(e.clientY-state.ly)*0.004;
    state.tPitch=Math.max(-1.2,Math.min(1.2,state.tPitch));state.lx=e.clientX;state.ly=e.clientY;state.moved=true;return;}
  let best=null,bd=1e9;
  nodes.forEach(n=>{const p=project(n);const d=Math.hypot(p.sx-e.clientX,p.sy-e.clientY);
    const rr=Math.max(7,(n.isCluster?n.r*1.5:n.r)*p.s);
    if(d<rr+6&&d<bd){bd=d;best=n;}});
  state.hover=best; cv.style.cursor=best?"pointer":"default";
});
cv.addEventListener("wheel",e=>{e.preventDefault();
  state.tZoom=Math.max(0.35,Math.min(4.5,state.tZoom*(e.deltaY<0?1.12:0.89)));},{passive:false});
cv.addEventListener("click",e=>{
  if(state.moved){state.moved=false;return;}
  if(state.hover){select(state.hover);} else {select(null);}
});
function select(n){
  setChain(false);
  state.selected=n;
  if(n){const t=n.isCluster?n:n.parent||n;state.tcx=t.x;state.tcy=t.y;state.tcz=t.z;state.tZoom=n.isCluster?1.7:2.1;}
  else {state.tcx=state.tcy=state.tcz=0;state.tZoom=1;}
  renderPanel();
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){setChain(false);select(null);}
  if(e.key==="c"||e.key==="C"){toggleChain();}
});
document.getElementById("b-theme").onclick=()=>{state.dark=!state.dark;
  document.body.classList.toggle("dark",state.dark);
  document.documentElement.style.background=css("--paper");
  document.getElementById("b-theme").textContent="theme: "+(state.dark?"dark":"light");};
document.getElementById("b-replay").onclick=()=>{setChain(false);state.replayStart=performance.now();renderPanel();};
document.getElementById("b-chain").onclick=()=>toggleChain();
document.getElementById("b-fix").onclick=()=>{state.previewFix=!state.previewFix;
  document.getElementById("b-fix").classList.toggle("on",state.previewFix);renderPanel();};
function setChain(on){
  const was=state.chainOn;
  state.chainOn=on;
  document.getElementById("b-chain").classList.toggle("on",on);
  if(was&&!on){state.tcx=state.tcy=state.tcz=0;state.tZoom=1;}
}
function toggleChain(){
  setChain(!state.chainOn);
  if(state.chainOn){state.chainStart=performance.now();state.selected=null;
    const cs=CHAIN.steps.map(s=>nodeById[s.node]).filter(Boolean);
    state.tcx=cs.reduce((a,n)=>a+n.x,0)/cs.length;
    state.tcy=cs.reduce((a,n)=>a+n.y,0)/cs.length;
    state.tcz=cs.reduce((a,n)=>a+n.z,0)/cs.length;
    state.tZoom=1.55;}
  renderPanel();
}

/* ---------- panels ---------- */
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function renderPanel(){
  const el=document.getElementById("panel");
  if(state.chainOn){
    const step=chainStep();
    const s=CHAIN.steps[step];
    el.style.display="block";
    el.innerHTML=`<h2>${esc(CHAIN.label)}</h2><p class="sub">step ${step+1} of ${CHAIN.steps.length} — ${esc(s.role)}</p>`+
      `<div><code>${esc(s.file)}</code><br>${esc(s.text)}</div>`+
      `<div class="f"><strong>same root cause</strong><br>${CHAIN.variants.map(v=>esc(v)).join("<br>")}</div>`+
      `<div class="f"><span class="pr">${esc(CHAIN.remediation)}</span><br>${esc(CHAIN.remediationNote)}</div>`+
      `<div class="f" style="color:var(--ink-soft)">${esc(CHAIN.note)}</div>`;
    return;
  }
  const n=state.selected;
  if(!n){el.style.display="none";return;}
  const list=n.isCluster?n.children.reduce((a,k)=>a.concat(k.findings),n.findings):n.findings;
  el.style.display="block";
  el.innerHTML=`<h2>${esc(n.name)}</h2><p class="sub">${esc(n.desc||"")}</p>`+
    (n.files||[]).map(f=>`<div><code>${esc(f.path)}${f.lines?":"+esc(f.lines):""}</code></div>`).join("")+
    (list.length?list.map(f=>{
      const fixed=state.previewFix||f.remediated;
      return `<div class="f"><span class="sev ${fixed?"fixed":esc(f.severity)}">${fixed?"FIXED (preview)":esc(f.severity.toUpperCase())}</span> `+
      `<strong>${esc(f.title)}</strong><br><code>${esc(f.path)}:${f.line}</code><br>${esc(f.description)}`+
      (f.pr_label?`<div class="pr">${esc(f.pr_label)}</div>`:"")+
      (f.pr_note?`<div>${esc(f.pr_note)}</div>`:"")+`</div>`;}).join("")
      :`<div class="f" style="color:var(--ink-soft)">no findings attributed to this subsystem</div>`);
}
function counters(){
  document.getElementById("counterline").textContent=
    `${nodes.length} subsystems · ${relEdges.length} relations · ${totalFindings} findings · `+
    `${fixedCount()} fixed / ${openCount()} open`+(state.previewFix?" (hypothetical preview)":"");
  document.getElementById("stats").innerHTML=
    `heat weight: critical 8 · high 4 · medium 2 · low 1<br>`+
    `solid = subsystem hierarchy · dashed = cross-subsystem relation`;
  document.getElementById("legend").innerHTML=
    `demonstration retail-banking codebase (Spring Boot)<br>not customer code`;
}

/* ---------- animation clocks ---------- */
const SWEEP_MS=6000, STEP_MS=8000;
function replayT(){ if(!state.replayStart) return 1; const t=(performance.now()-state.replayStart)/SWEEP_MS; return t>=1?1:t; }
function chainStep(){ if(!state.chainOn) return -1;
  return Math.min(CHAIN.steps.length-1, Math.floor((performance.now()-state.chainStart)/STEP_MS)); }
let lastStep=-1;

/* ---------- main loop ---------- */
function frame(){
  const k=0.12;
  state.yaw+=(state.tYaw-state.yaw)*k; state.pitch+=(state.tPitch-state.pitch)*k;
  state.zoom+=(state.tZoom-state.zoom)*k;
  state.cx+=(state.tcx-state.cx)*k; state.cy+=(state.tcy-state.cy)*k; state.cz+=(state.tcz-state.cz)*k;

  const ink=css("--ink"), inkSoft=css("--ink-soft");
  ctx.fillStyle=css("--paper"); ctx.fillRect(0,0,W,H);
  // paper grain / grid
  ctx.save();ctx.globalAlpha=state.dark?0.05:0.09;ctx.strokeStyle=ink;ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();

  const sel=state.selected, chain=state.chainOn, step=chainStep();
  if(chain && step!==lastStep){lastStep=step;renderPanel();}
  const chainNodes=new Set(CHAIN.steps.map(s=>s.node));

  function alphaFor(n){
    if(chain) return chainNodes.has(n.id)||(n.parent&&chainNodes.has(n.parent.id))?1:0.12;
    if(!sel) return 1;
    if(n===sel) return 1;
    if(sel.isCluster && n.parent===sel) return 1;
    if(!sel.isCluster && (n===sel.parent || n.parent===sel.parent)) return n===sel.parent?0.9:0.5;
    const rel=relEdges.some(e=>(e.a===n&&e.b===clusterOf(sel))||(e.b===n&&e.a===clusterOf(sel)));
    return rel?0.75:0.2;
  }
  function clusterOf(n){return n.isCluster?n:n.parent;}

  ctx.strokeStyle=ink;
  // hierarchy edges
  clusters.forEach(c=>{const pc=project(c);
    c.children.forEach(n=>{const p=project(n);
      wobbleLine(pc.sx,pc.sy,p.sx,p.sy,hash(c.id+n.id),0.3*Math.min(alphaFor(c),alphaFor(n))+0.04,false);});});
  // relation edges
  relEdges.forEach(e=>{const a=project(e.a),b=project(e.b);
    wobbleLine(a.sx,a.sy,b.sx,b.sy,hash(e.a.id+e.b.id),0.3*Math.min(alphaFor(e.a),alphaFor(e.b))+0.03,true);});

  const rt=replayT();
  const order=nodes;
  const drawList=nodes.map(n=>({n,p:project(n)})).sort((a,b)=>b.p.z-a.p.z);

  drawList.forEach(({n,p})=>{
    const idx=order.indexOf(n);
    const swept=rt>=(idx+1)/order.length;
    const pulse=(()=>{const at=(idx/order.length); const d=rt-at;
      return (d>=0&&d<0.09&&rt<1)?1-(d/0.09):0;})();
    const a=alphaFor(n);
    if(swept||rt>=1) heat(n,p,a*(state.replayStart?Math.min(1,(rt-(idx+1)/order.length)*8+0.2):1));
    let fill=state.dark?"rgba(120,132,148,0.30)":"rgba(150,160,176,0.26)";
    if(n.isCluster) fill=state.dark?"rgba(140,152,168,0.38)":"rgba(120,134,152,0.30)";
    if(pulse>0) fill=`rgba(64,132,196,${0.25+0.6*pulse})`;
    ctx.strokeStyle=ink;
    hatchNode(n,p,a,fill);
  });

  // labels: never overlap each other or the HTML chrome; flip side or drop instead
  const boxes=[];
  const uiRects=uiBoxes();
  function freeSlot(x,y,w){
    if(x<6||x+w>W-6||y<20||y>H-20) return false;
    if(uiRects.some(r=>x<r.right+4 && r.left-4<x+w && y-7<r.bottom+4 && r.top-4<y+7)) return false;
    return !boxes.some(b=>Math.abs(b.y-y)<12 && x<b.x+b.w+6 && b.x<x+w+6);
  }
  function placeLabel(text,p,off,alpha,size,weight){
    ctx.save();ctx.font=`${weight} ${size}px ui-monospace,Menlo,Consolas,monospace`;
    const w=ctx.measureText(text).width;ctx.restore();
    const dys=[0,-13,13,-26,26,-39,39];
    for(const side of [1,-1]){
      for(const dy of dys){
        const x = side>0 ? p.sx+off : p.sx-off-w;
        const y = p.sy+dy;
        if(freeSlot(x,y,w)){boxes.push({x,y,w});label(text,x,y,alpha,size,weight);return;}
      }
    }
  }
  if(!chain){
    const labelled=drawList.slice().reverse().filter(({n})=>
      n.isCluster || (sel&&(n===sel||n.parent===sel||n.parent===(sel.parent))) || n===state.hover);
    labelled.sort((a,b)=>((b.n===state.hover?2:0)+(b.n.isCluster?1:0))-((a.n===state.hover?2:0)+(a.n.isCluster?1:0)));
    labelled.forEach(({n,p})=>{
      const a=alphaFor(n);
      if(a<=0.25) return;
      placeLabel(n.name,p,Math.max(9,(n.isCluster?n.r*1.5:n.r)*p.s)+5,a,
        n.isCluster?11:10,n.isCluster?600:400);
    });
  }

  // chain overlay
  const banner=document.getElementById("banner");
  if(chain){
    banner.style.display="block";
    banner.textContent="exploit path — controller entry point → service sink (not a multi-finding CVE chain)";
    for(let i=1;i<=step;i++){
      const a=project(nodeById[CHAIN.steps[i-1].node]), b=project(nodeById[CHAIN.steps[i].node]);
      arrow(a,b,ink);
    }
    const placed=[];
    CHAIN.steps.forEach((s,i)=>{
      if(i>step) return;
      const n=nodeById[s.node], p=project(n);
      const isSink=i===CHAIN.steps.length-1;
      ctx.save();
      ctx.globalAlpha=1;ctx.strokeStyle=isSink?"#a3232b":css("--accent");ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(p.sx,p.sy,Math.max(18,16*p.s),0,7);ctx.stroke();ctx.restore();
      // leader line to a callout slot that avoids the side panel and other callouts
      const txt=`${i+1}. ${s.role} — ${s.file}`;
      ctx.save();ctx.font="600 10.5px ui-monospace,Menlo,Consolas,monospace";
      const tw=ctx.measureText(txt).width;ctx.restore();
      const gap=Math.max(26,20*p.s), rightLimit=W-345;
      let align="left", lx=p.sx+gap;
      if(lx+tw>rightLimit){align="right";lx=Math.max(tw+16,p.sx-gap);}
      let ly=p.sy-26;
      while(placed.some(q=>Math.abs(q.y-ly)<20)||ly>H-70) ly-=22;
      if(ly<96){ly=p.sy+26;while(placed.some(q=>Math.abs(q.y-ly)<20)) ly+=22;}
      placed.push({x:lx,y:ly});
      ctx.save();ctx.globalAlpha=0.6;ctx.strokeStyle=isSink?"#a3232b":css("--accent");ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.sx+(align==="left"?1:-1)*Math.max(18,16*p.s),p.sy);
      ctx.lineTo(lx+(align==="left"?-6:6),ly);ctx.stroke();ctx.restore();
      label(txt,lx,ly,1,10.5,600,align);
    });
  } else if(state.previewFix){
    banner.style.display="block";
    banner.textContent="hypothetical preview — all findings shown as fixed; no fix is merged";
  } else banner.style.display="none";

  counters();
  requestAnimationFrame(frame);
}
function arrow(a,b,ink){
  ctx.save();ctx.strokeStyle=css("--accent");ctx.lineWidth=1.5;ctx.globalAlpha=0.95;
  ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();
  const ang=Math.atan2(b.sy-a.sy,b.sx-a.sx), L=9;
  const tx=b.sx-Math.cos(ang)*16, ty=b.sy-Math.sin(ang)*16;
  ctx.beginPath();ctx.moveTo(tx,ty);
  ctx.lineTo(tx-Math.cos(ang-0.4)*L,ty-Math.sin(ang-0.4)*L);
  ctx.moveTo(tx,ty);
  ctx.lineTo(tx-Math.cos(ang+0.4)*L,ty-Math.sin(ang+0.4)*L);
  ctx.stroke();ctx.restore();
}
/* optional deep-link state for deterministic capture: #dark, #chain, #chain=3, #replay, #fix */
(function initHash(){
  const h=location.hash.slice(1); if(!h) return;
  const parts=h.split(",");
  parts.forEach(p=>{
    const [k,v]=p.split("=");
    if(k==="dark") document.getElementById("b-theme").click();
    if(k==="fix") document.getElementById("b-fix").click();
    if(k==="replay") state.replayStart=performance.now();
    if(k==="chain"){ toggleChain(); if(v) state.chainStart=performance.now()-(Number(v)-1)*STEP_MS; }
  });
})();
counters();
