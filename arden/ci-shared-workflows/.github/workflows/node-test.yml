name: node-test
on:
  workflow_call:
    secrets:
      ARTIFACTORY_TOKEN: { required: false }
permissions: { id-token: write, contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --ignore-scripts && npm test
