# v4 — Artifactory access via GitHub OIDC token exchange. No long-lived ARTIFACTORY_TOKEN secret needed.
name: java-build
on:
  workflow_call:
    inputs:
      java-version: { type: string, default: "17" }
    secrets:
      ARTIFACTORY_TOKEN: { required: false }   # kept optional for v3 callers during migration
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ inputs.java-version }}", cache: maven }
      - name: Exchange GitHub OIDC token for a short-lived Artifactory token
        id: art
        run: |
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=artifactory.ardencm.internal" | jq -r .value)
          TOKEN=$(curl -sS -X POST https://artifactory.ardencm.internal/access/api/v1/oidc/token \
            -H 'content-type: application/json' \
            -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token\":\"$OIDC\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"provider_name\":\"github\"}" | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "ARTIFACTORY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: mvn -B -s ci/settings.xml verify
