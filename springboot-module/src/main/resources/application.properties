spring.application.name=bankapp
# MySQL Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/BankDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Test@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Micronaut Service Configuration
micronaut.service.url=${MICRONAUT_SERVICE_URL:http://micronaut-app:8080}

# Feign Configuration
feign.client.config.micronaut-service.connect-timeout=5000
feign.client.config.micronaut-service.read-timeout=10000
feign.client.config.micronaut-service.logger-level=basic

# Circuit Breaker Configuration
feign.circuitbreaker.enabled=true
