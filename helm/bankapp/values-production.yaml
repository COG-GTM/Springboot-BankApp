namespace: bankapp-production

configmap:
  name: bankapp-config
  data:
    MYSQL_DATABASE: BankDB
    SPRING_DATASOURCE_USERNAME: root

db_statefulset:
  name: mysql
  storage: 20Gi

app_deployment:
  name: bankapp
  cpu_req: 200m
  cpu_limit: 1000m
  mem_req: 512Mi
  mem_limit: 1Gi

image:
  app: ghcr.io/cog-gtm/bankapp:latest
  db: mysql:8.0

bankapp_svc:
  port: 8080
  targetPort: 8080
  nodePort: 30080

mysql_svc:
  port: 3306
  targetPort: 3306

hpa:
  min_replica: 2
  max_replica: 10
  cpu_utilizatoion: 40

secret:
  name: mysql-secret
  data:
    MYSQL_ROOT_PASSWORD: Test@123
    SPRING_DATASOURCE_PASSWORD: Test@123
