# namespace 
namespace: bankapp-namespace

# name of configmap, database and db user.
configmap:  
  name: bankapp-config
  data:
      MYSQL_DATABASE: BankDB
      SPRING_DATASOURCE_USERNAME: root

## name, label and storage size for database 
db_statefulset:
  name: mysql
  storage: 5Gi

## name and label of app deployment
app_deployment: 
  name: bankapp
  cpu_req: 80m
  cpu_limit: 800m
  mem_req: 150Mi
  mem_limit: 700Mi

## Images are rendered as <repository>:<tag>@<digest>. The chart refuses to render
## without a fixed tag and a sha256 digest, and rejects the "latest" tag.
image:
  app:
    # Built and pushed by this repo's Jenkinsfile (docker_build/docker_push -> madhupdevops/bankapp:<DOCKER_TAG>).
    # Point this at a registry you control if you build elsewhere.
    repository: madhupdevops/bankapp
    # Required at install time: the DOCKER_TAG built by CI and the digest printed by `docker push`, e.g.
    #   helm install bankapp ./helm/bankapp --set image.app.tag=v1.4.2 --set image.app.digest=sha256:<64 hex>
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  db:
    repository: mysql
    # MySQL 8.4 LTS, multi-arch index digest (docker-library/repo-info repos/mysql/remote/8.4.13.md).
    # Keep the major version fixed; bump tag and digest together.
    tag: "8.4.13"
    digest: "sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902"
    pullPolicy: IfNotPresent

# NodePort svc for bankapp
bankapp_svc:
    port: 8080
    targetPort: 8080
    nodePort: 30080 


# headless svc configuration for db
mysql_svc:
    port: 3306
    targetPort: 3306

# HPA minimun and maximum pods and average cpu utilization
hpa:
    min_replica: 1
    max_replica: 5
    cpu_utilizatoion: 40

# Secret for Database connectivity

secret:
  name: mysql-secret
  data: 
    MYSQL_ROOT_PASSWORD: Test@123       # (Base64 encoded 'Test@123')
    SPRING_DATASOURCE_PASSWORD: Test@123       # (Base64 encoded 'Test@123')
 
