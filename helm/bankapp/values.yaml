# namespace 
namespace: bankapp-namespace

# name of configmap, database and db user.
configmap:  
  name: bankapp-config
  data:
      MYSQL_DATABASE: BankDB
      SPRING_DATASOURCE_USERNAME: root

## name, label and storage size for database 
db_statefulset:
  name: mysql
  storage: 5Gi

## name and label of app deployment
app_deployment: 
  name: bankapp
  cpu_req: 80m
  cpu_limit: 800m
  mem_req: 150Mi
  mem_limit: 700Mi

## images of app, db and the init container.
## app: repository must be in a registry your organisation controls and tag must
## be an explicit release tag (not "latest"); digest (sha256:...) is optional and
## pins the exact content. Both repository and tag are required, e.g.
##   helm install bankapp bankapp/ --set image.app.repository=registry.example.com/bank/bankapp --set image.app.tag=v1.4.2
## db / waitForDb: pinned to a version and multi-arch index digest.
image:
  app:
    repository: ""
    tag: ""
    digest: ""
  db: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
  waitForDb: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec

# NodePort svc for bankapp
bankapp_svc:
    port: 8080
    targetPort: 8080
    nodePort: 30080 


# headless svc configuration for db
mysql_svc:
    port: 3306
    targetPort: 3306

# HPA minimun and maximum pods and average cpu utilization
hpa:
    min_replica: 1
    max_replica: 5
    cpu_utilizatoion: 40

# Secret for Database connectivity

secret:
  name: mysql-secret
  data: 
    MYSQL_ROOT_PASSWORD: Test@123       # (Base64 encoded 'Test@123')
    SPRING_DATASOURCE_PASSWORD: Test@123       # (Base64 encoded 'Test@123')
 
