# namespace 
namespace: bankapp-namespace

# name of configmap, database and db user.
configmap:  
  name: bankapp-config
  data:
      MYSQL_DATABASE: BankDB
      # Least-privilege application user (all rights on MYSQL_DATABASE only).
      # The chart refuses to render with "root".
      SPRING_DATASOURCE_USERNAME: bankapp

## name, label and storage size for database 
db_statefulset:
  name: mysql
  storage: 5Gi

## name and label of app deployment
app_deployment: 
  name: bankapp
  cpu_req: 80m
  cpu_limit: 800m
  mem_req: 150Mi
  mem_limit: 700Mi

## image repository and tag of app and db.
image:
  app: trainwithshubham/springboot-bankapp:latest
  db: mysql:latest

# NodePort svc for bankapp
bankapp_svc:
    port: 8080
    targetPort: 8080
    nodePort: 30080 


# headless svc configuration for db
mysql_svc:
    port: 3306
    targetPort: 3306

# HPA minimun and maximum pods and average cpu utilization
hpa:
    min_replica: 1
    max_replica: 5
    cpu_utilizatoion: 40

# Secret for Database connectivity.
# No passwords are shipped with the chart, and `helm template`/`helm install`
# fail until they are supplied. Either:
#   - reference a Secret created out of band (External Secrets, Sealed Secrets,
#     `kubectl create secret ...`) that has the keys MYSQL_ROOT_PASSWORD and
#     SPRING_DATASOURCE_PASSWORD:   --set secret.existingSecret=<name>
#   - or pass two different passwords at install time:
#       --set-string secret.data.MYSQL_ROOT_PASSWORD="$(openssl rand -base64 24)"
#       --set-string secret.data.SPRING_DATASOURCE_PASSWORD="$(openssl rand -base64 24)"
secret:
  name: mysql-secret
  existingSecret: ""
  data:
    MYSQL_ROOT_PASSWORD: ""
    SPRING_DATASOURCE_PASSWORD: ""

# Only the bankapp pods may connect to MySQL on port 3306.
networkPolicy:
  enabled: true
