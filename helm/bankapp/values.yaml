# namespace 
namespace: bankapp-namespace

# name of configmap, database and db user.
configmap:  
  name: bankapp-config
  data:
      MYSQL_DATABASE: BankDB
      SPRING_DATASOURCE_USERNAME: bankapp

## name, label and storage size for database 
db_statefulset:
  name: mysql
  storage: 5Gi

## name and label of app deployment
app_deployment: 
  name: bankapp
  cpu_req: 80m
  cpu_limit: 800m
  mem_req: 150Mi
  mem_limit: 700Mi

## image repository and tag of app and db.
image:
  app: trainwithshubham/springboot-bankapp:latest
  db: mysql:latest

# NodePort svc for bankapp
bankapp_svc:
    port: 8080
    targetPort: 8080
    nodePort: 30080 


# headless svc configuration for db
mysql_svc:
    port: 3306
    targetPort: 3306

# HPA minimun and maximum pods and average cpu utilization
hpa:
    min_replica: 1
    max_replica: 5
    cpu_utilizatoion: 40

# Secret for Database connectivity.
# NEVER put passwords in this file - it is committed to Git.
# Either create `mysql-secret` out of band (External Secrets Operator, Sealed
# Secrets, Vault, or `kubectl create secret generic`) and leave `create: false`,
# or pass the values at install time from your secret manager:
#   helm install bankapp ./helm/bankapp \
#     --set secret.create=true \
#     --set secret.data.MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
#     --set secret.data.SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD"
secret:
  name: mysql-secret
  create: false
  data:
    MYSQL_ROOT_PASSWORD: ""
    SPRING_DATASOURCE_PASSWORD: ""

