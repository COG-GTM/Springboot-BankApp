suite: MySQL StatefulSet tests
templates:
  - templates/mysqlStatefulSet.yml
tests:
  - it: should be a StatefulSet
    asserts:
      - isKind:
          of: StatefulSet

  - it: should set the name to mysql
    asserts:
      - equal:
          path: metadata.name
          value: mysql

  - it: should set the default namespace to bankapp-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: bankapp-namespace

  - it: should set serviceName to mysql-headless
    asserts:
      - equal:
          path: spec.serviceName
          value: mysql-headless

  - it: should set replicas to 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should have app label on metadata
    asserts:
      - equal:
          path: metadata.labels.app
          value: mysql

  - it: should have app label on selector matchLabels
    asserts:
      - equal:
          path: spec.selector.matchLabels.app
          value: mysql

  - it: should have app label on pod template
    asserts:
      - equal:
          path: spec.template.metadata.labels.app
          value: mysql

  - it: should use default db image mysql:latest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "mysql:latest"

  - it: should expose container port 3306
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3306

  - it: should get MYSQL_ROOT_PASSWORD from secretKeyRef mysql-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: MYSQL_ROOT_PASSWORD

  - it: should get MYSQL_DATABASE from configMapKeyRef bankapp-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_DATABASE
            valueFrom:
              configMapKeyRef:
                name: bankapp-config
                key: MYSQL_DATABASE

  - it: should mount mysql-data volume at /var/lib/mysql
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mysql-data
            mountPath: /var/lib/mysql

  - it: should configure liveness probe with mysqladmin ping
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - mysqladmin
            - ping
            - -h
            - localhost
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 10

  - it: should configure readiness probe with mysqladmin ping
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - mysqladmin
            - ping
            - -h
            - localhost
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5

  - it: should have volumeClaimTemplate named mysql-data with ReadWriteOnce and 5Gi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: mysql-data
      - contains:
          path: spec.volumeClaimTemplates[0].spec.accessModes
          content: ReadWriteOnce
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi

  - it: should use custom db_statefulset name when overridden
    set:
      db_statefulset.name: custom-mysql
    asserts:
      - equal:
          path: metadata.name
          value: custom-mysql
      - equal:
          path: metadata.labels.app
          value: custom-mysql
      - equal:
          path: spec.serviceName
          value: custom-mysql-headless
      - equal:
          path: spec.selector.matchLabels.app
          value: custom-mysql
      - equal:
          path: spec.template.metadata.labels.app
          value: custom-mysql

  - it: should use custom storage when overridden
    set:
      db_statefulset.storage: 10Gi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
