apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.app_deployment.name }}-ingress"
  namespace: {{ default "bankapp-namespace" .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ default "nginx" .Values.ingress.className }}
  tls:
  - hosts:
    - {{ required "ingress.host is required" .Values.ingress.host | quote }}
    secretName: {{ required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName | quote }}
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: "{{ .Values.app_deployment.name }}-service"
            port:
              number: {{ default "8080" .Values.bankapp_svc.port}} 
