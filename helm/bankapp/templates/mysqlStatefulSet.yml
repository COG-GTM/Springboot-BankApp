apiVersion: apps/v1 
kind: StatefulSet
metadata:
  name: {{ .Values.db_statefulset.name }}
  namespace: {{ default "bankapp-namespace" .Values.namespace }}
  labels:
    app: {{ .Values.db_statefulset.name }}
spec:
  serviceName: "{{ .Values.db_statefulset.name }}-headless"
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.db_statefulset.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.db_statefulset.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Values.db_statefulset.name }}
        image: {{ .Values.image.db }}
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:                      ### CRITICAL
              name: mysql-secret                  ### CRITICAL
              key: MYSQL_ROOT_PASSWORD    ### CRITICAL
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.configmap.name }} 
              key: MYSQL_DATABASE 
        volumeMounts:
        - name: "{{ .Values.db_statefulset.name }}-data"
          mountPath: /var/lib/mysql
        - name: mysql-run
          mountPath: /var/run/mysqld
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: mysql-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: "{{ .Values.db_statefulset.name }}-data"
      labels:
        app: {{ .Values.db_statefulset.name }}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage:  {{ .Values.db_statefulset.storage }}

