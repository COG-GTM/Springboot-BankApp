apiVersion: apps/v1 
kind: StatefulSet
metadata:
  name: {{ .Values.db_statefulset.name }}
  namespace: {{ default "bankapp-namespace" .Values.namespace }}
  labels:
    app: {{ .Values.db_statefulset.name }}
spec:
  serviceName: "{{ .Values.db_statefulset.name }}-headless"
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.db_statefulset.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.db_statefulset.name }}
    spec:
      containers:
      - name: {{ .Values.db_statefulset.name }}
        image: {{ .Values.image.db }}
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:                      ### CRITICAL
              name: mysql-secret                  ### CRITICAL
              key: MYSQL_ROOT_PASSWORD    ### CRITICAL
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.configmap.name }} 
              key: MYSQL_DATABASE 
        - name: POSTGRES_USER
          value: root
        volumeMounts:
        - name: "{{ .Values.db_statefulset.name }}-data"
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - root
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - root
          initialDelaySeconds: 10
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: "{{ .Values.db_statefulset.name }}-data"
      labels:
        app: {{ .Values.db_statefulset.name }}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage:  {{ .Values.db_statefulset.storage }}

