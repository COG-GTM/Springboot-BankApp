{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ default "bankapp-namespace" .Values.namespace }}
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ required "secret.data.MYSQL_ROOT_PASSWORD is required when secret.create=true; pass it at install time, never commit it" .Values.secret.data.MYSQL_ROOT_PASSWORD | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ required "secret.data.SPRING_DATASOURCE_PASSWORD is required when secret.create=true; pass it at install time, never commit it" .Values.secret.data.SPRING_DATASOURCE_PASSWORD | b64enc | quote }}
{{- end }}
