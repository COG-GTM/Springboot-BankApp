{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ default "bankapp-namespace" .Values.namespace }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ required "secret.data.MYSQL_ROOT_PASSWORD must be supplied at install time (e.g. --set from your secret manager); never commit it to values.yaml" .Values.secret.data.MYSQL_ROOT_PASSWORD | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ required "secret.data.SPRING_DATASOURCE_PASSWORD must be supplied at install time (e.g. --set from your secret manager); never commit it to values.yaml" .Values.secret.data.SPRING_DATASOURCE_PASSWORD | quote }}
{{- end }}
