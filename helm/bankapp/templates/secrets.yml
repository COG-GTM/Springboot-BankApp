{{- if not .Values.secret.existingSecret }}
{{- $rootPassword := required "secret.data.MYSQL_ROOT_PASSWORD is required (or set secret.existingSecret); see values.yaml" .Values.secret.data.MYSQL_ROOT_PASSWORD }}
{{- $appPassword := required "secret.data.SPRING_DATASOURCE_PASSWORD is required (or set secret.existingSecret); see values.yaml" .Values.secret.data.SPRING_DATASOURCE_PASSWORD }}
{{- if eq $rootPassword $appPassword }}
{{- fail "secret.data.SPRING_DATASOURCE_PASSWORD must differ from secret.data.MYSQL_ROOT_PASSWORD" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }} 
  namespace: {{ default "bankapp-namespace" .Values.namespace }}
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ $rootPassword | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ $appPassword | b64enc | quote }}
{{- end }}
