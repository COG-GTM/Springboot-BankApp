apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configmap.name }} 
  namespace: {{ default "bankapp-namespace" .Values.namespace }}
data:
  MARIADB_DATABASE: {{ .Values.configmap.data.MARIADB_DATABASE }} 
  SPRING_DATASOURCE_URL: jdbc:mariadb://{{ .Values.db_statefulset.name }}-0.{{ .Values.db_statefulset.name }}-headless.{{ default "bankapp-namespace" .Values.namespace }}.svc.cluster.local:3306/{{ .Values.configmap.data.MARIADB_DATABASE }}?useSSL=false&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: {{ .Values.configmap.data.SPRING_DATASOURCE_USERNAME }} 

