spring.application.name=bankapp
# In-memory H2 database for tests (no external MySQL required)
spring.datasource.url=jdbc:h2:mem:bankappdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate configuration (dialect auto-detected for H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
