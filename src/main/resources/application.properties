spring.application.name=bankapp
# MySQL Database configuration
# Credentials are injected at runtime (environment variables / secret manager) and are
# deliberately not stored in this file. SPRING_DATASOURCE_PASSWORD has no default, so the
# application fails fast instead of falling back to a shared credential.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bankappdb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
