spring.application.name=bankapp
# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bankappdb?useSSL=false&serverTimezone=UTC
# Credentials come from the environment (SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD).
# Startup fails if no password is supplied.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
