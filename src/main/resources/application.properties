quarkus.application.name=bankapp

# HTTP
quarkus.http.port=8080

# MongoDB connection
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=BankDB

# Health
quarkus.smallrye-health.root-path=/q/health

# Form-based authentication
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/dashboard
quarkus.http.auth.form.post-location=/login
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.logout-path=/logout
quarkus.http.auth.form.location-cookie=quarkus-redirect-location
quarkus.http.auth.session.encryption-key=bankapp-form-auth-session-encryption-key-change-me

# Authorization: public pages vs. authenticated pages
quarkus.http.auth.permission.public.paths=/login,/register,/q/health,/q/health/*,/images/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
