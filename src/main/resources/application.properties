spring.application.name=bankapp

# MySQL Database configuration.
# Credentials are supplied by the environment only (ITGC-SEC-06); see docs/configuration-contract.md.
# Startup fails fast if SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD are absent.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bankappdb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration.
# The schema is owned by Flyway migrations (ITGC-DATA-10); Hibernate may only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# Flyway managed schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Audit log of financial events (ITGC-LOG-11)
logging.level.audit=INFO
