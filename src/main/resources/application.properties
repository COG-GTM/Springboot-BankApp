spring.application.name=bankapp
# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bankappdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Test@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
# Changed from 'update' to 'validate' for better production safety
# 'validate' verifies schema matches entities without modifying the database
# For development, consider using 'update' or Flyway/Liquibase for migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Hibernate 6.6 compatibility settings
# Ensure proper handling of null values in queries
spring.jpa.properties.hibernate.query.null_ordering=native
# Use modern JPA naming strategy (already default in Hibernate 6.x)
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Enable batch fetching for better performance
spring.jpa.properties.hibernate.default_batch_fetch_size=10
# Disable open-in-view pattern to avoid lazy loading issues
spring.jpa.open-in-view=false
