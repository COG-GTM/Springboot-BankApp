spring.application.name=bankapp
# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bankappdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Test@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Sign-in throttling: lock a username / client address after this many failures within the window
bankapp.security.login.max-failures-per-user=5
bankapp.security.login.max-failures-per-client=20
bankapp.security.login.failure-window=PT15M
bankapp.security.login.lockout-duration=PT15M
