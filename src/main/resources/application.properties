spring.application.name=bankapp
# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bankappdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Test@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Session cookie is only sent over HTTPS. Behind the TLS-terminating Ingress, honour
# X-Forwarded-Proto so Spring sees the request as secure (redirects use https, HSTS is sent).
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=native
