<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Wells Fargo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Times New Roman', Georgia, serif;
            background-color: #F7F3E9;
            color: #2E2A2B;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar-custom {
            background-color: #7A1216;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 2px solid #B08D57;
        }

        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom .navbar-brand {
            font-weight: bold;
        }

        .container {
            max-width: 460px;
            padding: 28px;
            background-color: #FFFFFF;
            border-radius: 0;
            border: 1px solid #B08D57;
            box-shadow: none;
            position: relative;
            text-align: left;
        }

        .container h2 {
            color: #2E2A2B;
            margin-bottom: 18px;
        }

        .form-group label {
            color: #3A2F2F;
            text-align: left;
            display: block;
        }

        .form-group input {
            border: 1px solid #B08D57;
            background-color: #FFFFFF;
            color: #2E2A2B;
        }

        .btn {
            background-color: #D71921;
            border: 1px solid #7A1216;
            color: #FFFFFF;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #B5151C;
        }

        .custom-link {
            color: #7A1216;
            text-decoration: none;
            font-weight: bold;
        }

        .custom-link:hover {
            text-decoration: underline;
        }

        .footer {
            background-color: #7A1216;
            color: #FFFFFF;
            padding: 12px 0;
            font-size: 13px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            border-top: 2px solid #B08D57;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="/images/wells-fargo-logo.png" alt="Wells Fargo" style="height:28px;margin-right:10px;">
        Wells Fargo
    </a>
</nav>

<div class="container">
    <h2 class="text-left">Login</h2>
    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <label>Username:</label>
            <input type="text" class="form-control" name="username" required />
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" class="form-control" name="password" required />
        </div>
        <button type="submit" class="btn btn-block">Login</button>
    </form>
    <p class="mt-3">Don't have an account? <a href="/register" class="custom-link">Register here</a></p>

    <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
        Invalid username or password.
    </div>
</div>

<footer class="footer">
    <p>&copy; 2024 Wells Fargo Bank, N.A. All rights reserved. | <a href="#" class="custom-link">Privacy Policy</a> | <a href="#" class="custom-link">Terms of Service</a></p>
</footer>

</body>
</html>
