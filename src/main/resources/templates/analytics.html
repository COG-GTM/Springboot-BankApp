<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Analytics - Wells Fargo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Times New Roman', Georgia, serif;
            background-color: #F7F3E9;
            color: #2E2A2B;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .navbar-custom {
            background-color: #7A1216;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 2px solid #B08D57;
        }

        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom .navbar-brand {
            font-weight: bold;
        }

        .analytics-container {
            max-width: 1200px;
            margin: 90px auto 80px auto;
            padding: 0 15px;
        }

        h2, h3, h4 {
            margin-bottom: 20px;
        }

        .chart-card {
            background-color: #FFFFFF;
            padding: 20px;
            border-radius: 0;
            border: 1px solid #B08D57;
            box-shadow: none;
            margin-bottom: 20px;
        }

        .chart-card h4 {
            color: #7A1216;
            border-bottom: 1px solid #B08D57;
            padding-bottom: 10px;
        }

        .placeholder-note {
            font-size: 12px;
            color: #8a6d3b;
            font-style: italic;
        }

        .footer {
            background-color: #7A1216;
            color: #FFFFFF;
            padding: 15px 0;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            border-top: 2px solid #B08D57;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="/images/wells-fargo-logo.png" alt="Wells Fargo" style="height:28px;margin-right:10px;">
        Wells Fargo
    </a>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
        <li class="nav-item"><a class="nav-link" href="/analytics">Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
    </ul>
</nav>

<div class="analytics-container">
    <div class="text-center">
        <h2>Analytics Dashboard</h2>
        <p class="placeholder-note">Displaying placeholder data &mdash; live analytics API is in development.</p>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="chart-card">
                <h4>Spending by Category</h4>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <h4>Monthly Income vs. Expenses</h4>
                <canvas id="incomeExpenseChart"></canvas>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="chart-card">
                <h4>Spending Trend Over Time</h4>
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    &copy; Wells Fargo &mdash; Analytics Preview
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
    // Wells Fargo themed palette
    const wfPalette = ['#7A1216', '#D71921', '#B08D57', '#2E2A2B', '#8C6D2F', '#C77B30', '#5B0E11', '#E5A84B'];

    // 1. Spending by Category (donut)
    new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
            labels: ['Groceries', 'Dining', 'Transportation', 'Utilities', 'Entertainment', 'Shopping', 'Healthcare'],
            datasets: [{
                data: [420, 280, 180, 220, 150, 310, 90],
                backgroundColor: wfPalette,
                borderColor: '#FFFFFF',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });

    // 2. Monthly Income vs Expenses (bar)
    new Chart(document.getElementById('incomeExpenseChart'), {
        type: 'bar',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
            datasets: [
                {
                    label: 'Income',
                    data: [3200, 3400, 3300, 3500, 3600, 3550],
                    backgroundColor: '#B08D57'
                },
                {
                    label: 'Expenses',
                    data: [2100, 2400, 2250, 2600, 2300, 2450],
                    backgroundColor: '#7A1216'
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true, ticks: { callback: v => '$' + v } }
            },
            plugins: { legend: { position: 'bottom' } }
        }
    });

    // 3. Spending Trend (line)
    new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
            labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6', 'Week 7', 'Week 8'],
            datasets: [{
                label: 'Weekly Spending',
                data: [540, 620, 480, 710, 590, 650, 700, 560],
                borderColor: '#D71921',
                backgroundColor: 'rgba(215, 25, 33, 0.15)',
                fill: true,
                tension: 0.3,
                pointBackgroundColor: '#7A1216'
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true, ticks: { callback: v => '$' + v } }
            },
            plugins: { legend: { position: 'bottom' } }
        }
    });
</script>
</body>
</html>
