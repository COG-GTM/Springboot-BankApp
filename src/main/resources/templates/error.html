<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - Wells Fargo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Times New Roman', Georgia, serif;
            background-color: #F7F3E9;
            color: #2E2A2B;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar-custom {
            background-color: #7A1216;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 2px solid #B08D57;
        }

        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom .navbar-brand {
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            padding: 28px;
            background-color: #FFFFFF;
            border-radius: 0;
            border: 1px solid #B08D57;
            box-shadow: none;
            position: relative;
            text-align: center;
        }

        .container h2 {
            color: #7A1216;
            margin-bottom: 18px;
        }

        .error-icon {
            font-size: 48px;
            color: #D71921;
            margin-bottom: 15px;
        }

        .error-message {
            color: #2E2A2B;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #FFF5F5;
            border: 1px solid #D71921;
            border-radius: 4px;
        }

        .error-status {
            color: #7A1216;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #D71921;
            border: 1px solid #7A1216;
            color: #FFFFFF;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #B5151C;
            color: #FFFFFF;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: 1px solid #5a6268;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .footer {
            background-color: #7A1216;
            color: #FFFFFF;
            padding: 12px 0;
            font-size: 13px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            border-top: 2px solid #B08D57;
        }

        .footer a {
            color: #B08D57;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="/images/wells-fargo-logo.png" alt="Wells Fargo" style="height:28px;margin-right:10px;">
        Wells Fargo
    </a>
</nav>

<div class="container">
    <div class="error-icon">&#9888;</div>
    <h2>Something Went Wrong</h2>
    
    <div class="error-status" th:if="${status}">
        Error Code: <span th:text="${status}">500</span>
    </div>
    
    <div class="error-message" th:if="${error}">
        <span th:text="${error}">An unexpected error occurred.</span>
    </div>
    
    <div class="mt-4">
        <a href="/dashboard" class="btn btn-block mb-2">Go to Dashboard</a>
        <a href="/login" class="btn btn-secondary btn-block">Back to Login</a>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2024 Wells Fargo Bank, N.A. All rights reserved. | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
</footer>

</body>
</html>
