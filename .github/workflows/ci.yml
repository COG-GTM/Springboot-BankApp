# GitHub Actions migration of the Jenkins CI pipeline (./Jenkinsfile).
#
# Original Jenkins stages (preserved as jobs/steps below):
#   1. Workspace cleanup       -> implicit on ephemeral GitHub-hosted runners
#   2. Git: Code Checkout      -> actions/checkout
#   3. Trivy: Filesystem scan  -> aquasecurity/trivy-action
#   4. OWASP: Dependency check -> dependency-check/Dependency-Check_Action
#   5. SonarQube: Code Analysis -> SonarSource/sonarqube-scan-action
#   6. SonarQube: Quality Gate -> SonarSource/sonarqube-quality-gate-action
#                                  (continue-on-error mirrors abortPipeline:false)
#   7. Docker: Build Images    -> docker/build-push-action
#   8. Docker: Push to DockerHub -> docker/build-push-action (push: true)
#   post.success:
#     - archiveArtifacts '*.xml'  -> actions/upload-artifact
#     - build job: BankApp-CD     -> gh workflow run cd.yml -f docker_tag=<tag>
#
# Required repository secrets:
#   - SONAR_TOKEN, SONAR_HOST_URL                (SonarQube analysis + quality gate)
#   - DOCKERHUB_USERNAME, DOCKERHUB_TOKEN        (Docker Hub login + push)
# Optional:
#   - DOCKERHUB_USER repository variable to override the image namespace
#     (defaults to 'madhupdevops' to match the original Jenkinsfile).

name: CI

on:
  push:
    branches: [DevOps]
  pull_request:
    branches: [DevOps]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker image tag to build and push"
        required: true
        type: string

permissions:
  contents: read
  actions: write   # needed to dispatch the CD workflow on success

env:
  IMAGE_NAME: bankapp
  DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER || 'madhupdevops' }}

jobs:
  build:
    name: Build, Scan, Analyse and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve docker tag
        id: tag
        run: |
          if [ -n "${{ inputs.docker_tag }}" ]; then
            echo "value=${{ inputs.docker_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # --- Stage: Trivy filesystem scan ---
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW

      # --- Stage: OWASP Dependency check ---
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ env.IMAGE_NAME }}
          path: "."
          format: "XML"
          out: "reports"
          args: >-
            --failOnCVSS 11
            --enableRetired

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn

      # --- Stage: SonarQube analysis + quality gate ---
      # Skipped automatically when SONAR_TOKEN is not configured so the
      # workflow remains green for forks / pre-config repos.
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=bankapp
            -Dsonar.projectName=bankapp

      - name: SonarQube quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        # Mirrors `waitForQualityGate abortPipeline: false` from the Jenkins shared lib.
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # --- Stage: Docker build + push ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}

      # --- Post: archive XML reports ---
      - name: Archive XML artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xml-artifacts
          path: "**/*.xml"
          if-no-files-found: ignore

      # --- Post: trigger downstream CD workflow on success ---
      - name: Trigger CD workflow
        if: ${{ success() && github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cd.yml \
            --ref ${{ github.ref_name }} \
            -f docker_tag=${{ steps.tag.outputs.value }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
