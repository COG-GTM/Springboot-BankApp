name: CI Pipeline

on:
  push:
    branches: [main, DevOps]
  pull_request:
    branches: [main, DevOps]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker image tag"
        required: false
        default: "latest"

env:
  DOCKER_IMAGE: bankapp
  DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}

jobs:
  trivy-fs-scan:
    name: "Trivy: Filesystem Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

  owasp-dependency-check:
    name: "OWASP: Dependency Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: bankapp
          path: .
          format: XML
          args: --failOnCVSS 11

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/

  sonarqube-analysis:
    name: "SonarQube: Code Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=bankapp
            -Dsonar.projectName=bankapp

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-push:
    name: "Docker: Build & Push"
    runs-on: ubuntu-latest
    needs: [trivy-fs-scan, owasp-dependency-check, sonarqube-analysis]
    outputs:
      docker_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Docker tag
        id: set-tag
        run: |
          if [ -n "${{ github.event.inputs.docker_tag }}" ]; then
            TAG="${{ github.event.inputs.docker_tag }}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/${{ env.DOCKER_IMAGE }}:${{ steps.set-tag.outputs.tag }}
            ${{ vars.DOCKERHUB_USER }}/${{ env.DOCKER_IMAGE }}:latest

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USER }}/${{ env.DOCKER_IMAGE }}:${{ steps.set-tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH

  trigger-cd:
    name: "Trigger CD Pipeline"
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Trigger CD workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd.yml',
              ref: context.ref,
              inputs: {
                docker_tag: '${{ needs.docker-build-push.outputs.docker_tag }}'
              }
            });
