name: CI Pipeline

on:
  push:
    branches: [ DevOps, main ]
  pull_request:
    branches: [ DevOps, main ]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker tag for the image'
        required: true
        default: 'latest'

env:
  DOCKER_TAG: ${{ github.event.inputs.docker_tag || github.sha }}
  DOCKERHUB_USERNAME: madhupdevops
  PROJECT_NAME: bankapp

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
    - name: Workspace cleanup
      run: |
        sudo rm -rf $GITHUB_WORKSPACE/*
        sudo rm -rf $GITHUB_WORKSPACE/.[!.]*

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: DevOps

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

    - name: Trivy filesystem scan
      run: |
        trivy fs .
      continue-on-error: true

    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'bankapp'
        path: '.'
        format: 'XML'
        out: 'reports'
      continue-on-error: true

    - name: Upload OWASP results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: reports/dependency-check-report.xml

    - name: Install SonarQube Scanner
      run: |
        wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
        unzip sonar-scanner-cli-4.8.0.2856-linux.zip
        sudo mv sonar-scanner-4.8.0.2856-linux /opt/sonar-scanner
        sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner

    - name: SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        sonar-scanner \
          -Dsonar.projectKey=bankapp \
          -Dsonar.projectName=bankapp \
          -Dsonar.sources=. \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -X
      continue-on-error: true

    - name: SonarQube Quality Gate
      uses: sonarqube-quality-gate-action@master
      timeout-minutes: 1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

    - name: Docker build
      run: |
        docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.DOCKER_TAG }} .

    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker push
      run: |
        docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.DOCKER_TAG }}

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          reports/*.xml
          *.xml

    - name: Trigger CD workflow
      if: success()
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        event-type: ci-complete
        client-payload: '{"docker_tag": "${{ env.DOCKER_TAG }}"}'
