name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      image-tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      image-name:
        description: 'Full image name (registry/repo)'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        type: string
        default: 'bankapp-namespace'
      helm-release-name:
        description: 'Helm release name'
        required: false
        type: string
        default: 'bankapp'
      helm-values-file:
        description: 'Path to Helm values file'
        required: false
        type: string
        default: 'helm/bankapp/values.yaml'
    secrets:
      kube-config:
        description: 'Kubernetes config for cluster access'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.kube-config }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Validate Helm chart
        run: |
          helm lint helm/bankapp/ \
            --set image.app=${{ inputs.image-name }}:${{ inputs.image-tag }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ inputs.helm-release-name }} helm/bankapp/ \
            --namespace ${{ inputs.namespace }} \
            --create-namespace \
            --set image.app=${{ inputs.image-name }}:${{ inputs.image-tag }} \
            --values ${{ inputs.helm-values-file }} \
            --wait \
            --timeout 300s

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ inputs.helm-release-name }} \
            --namespace ${{ inputs.namespace }} \
            --timeout=300s

      - name: Display deployment info
        if: always()
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n ${{ inputs.namespace }}
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ inputs.namespace }}
          echo ""
          echo "=== Services ==="
          kubectl get services -n ${{ inputs.namespace }}
