name: BankApp CD

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker image tag to deploy"
        required: true

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: bankapp

jobs:
  update-manifest-and-deploy:
    name: Update K8s Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Determine Docker Tag
        id: docker-tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.docker_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.docker_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Docker Image Tag
        run: |
          echo "Docker tag to deploy: ${{ steps.docker-tag.outputs.tag }}"
          if [ -z "${{ steps.docker-tag.outputs.tag }}" ]; then
            echo "::error::Docker tag is empty"
            exit 1
          fi

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: .*/bankapp.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.docker-tag.outputs.tag }}|g" kubernetes/bankapp-deployment.yml

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/bankapp-deployment.yml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update K8s deployment image to ${{ steps.docker-tag.outputs.tag }}"
          git push

      - name: Send Deployment Notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const tag = '${{ steps.docker-tag.outputs.tag }}';
            const emoji = status === 'success' ? ':white_check_mark:' : ':x:';
            const summary = `${emoji} **BankApp Deployment Update**\n` +
              `- **Status**: ${status}\n` +
              `- **Docker Tag**: ${tag}\n` +
              `- **Run**: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            core.summary.addRaw(summary).write();
