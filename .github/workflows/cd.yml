name: BankApp CD

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker tag of the image built by the CI workflow'
        required: true
        type: string

env:
  K8S_DEPLOYMENT_FILE: kubernetes/bankapp-deployment.yml
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/bankapp

jobs:
  update-k8s-manifest:
    name: "Update Kubernetes Manifest"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: DevOps
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker image tag
        run: echo "Docker tag received - ${{ inputs.docker_tag }}"

      - name: Update Kubernetes deployment manifest
        run: |
          sed -i "s|image:.*bankapp.*|image: ${{ env.DOCKER_IMAGE }}:${{ inputs.docker_tag }}|g" \
            ${{ env.K8S_DEPLOYMENT_FILE }}
          echo "Updated manifest:"
          grep 'image:' ${{ env.K8S_DEPLOYMENT_FILE }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.K8S_DEPLOYMENT_FILE }}
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update K8s deployment image to ${{ inputs.docker_tag }}"
          git push origin DevOps

  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: update-k8s-manifest
    if: always()

    steps:
      - name: Deployment summary
        run: |
          echo "## BankApp CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Tag**: ${{ inputs.docker_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.DOCKER_IMAGE }}:${{ inputs.docker_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **K8s Manifest**: ${{ env.K8S_DEPLOYMENT_FILE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.update-k8s-manifest.result }}" >> $GITHUB_STEP_SUMMARY
