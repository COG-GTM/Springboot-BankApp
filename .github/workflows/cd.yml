name: BankApp CD

on:
  repository_dispatch:
    types:
      - trigger-cd
  workflow_dispatch:
    inputs:
      DOCKER_TAG:
        description: 'Docker tag of the image built by the CI job'
        required: true
        type: string

env:
  DOCKER_TAG: ${{ github.event.client_payload.docker_tag || github.event.inputs.DOCKER_TAG }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: DevOps

      - name: Log Docker tag
        run: echo "DOCKER TAG RECEIVED:${{ env.DOCKER_TAG }}"

      - name: Update Kubernetes manifest
        run: |
          sed -i 's|trainwithshubham/bankapp-eks:.*|trainwithshubham/bankapp-eks:${{ env.DOCKER_TAG }}|g' kubernetes/bankapp-deployment.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/bankapp-deployment.yml
          git commit -m "Updated K8s Deployment Docker Image Version to ${{ env.DOCKER_TAG }}"
          git push origin DevOps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "BankApp Application has been updated and deployed - '${{ job.status }}'"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          content_type: text/html
          body: |
            <html>
            <body>
                <div style="background-color: #FFA07A; padding: 10px; margin-bottom: 10px;">
                    <p style="color: black; font-weight: bold;">Project: ${{ github.repository }}</p>
                </div>
                <div style="background-color: #90EE90; padding: 10px; margin-bottom: 10px;">
                    <p style="color: black; font-weight: bold;">Build Number: ${{ github.run_number }}</p>
                </div>
                <div style="background-color: #87CEEB; padding: 10px; margin-bottom: 10px;">
                    <p style="color: black; font-weight: bold;">URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
                </div>
            </body>
            </html>
