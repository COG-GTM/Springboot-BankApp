name: Java 11 Build

on:
  push:
    branches: [ DevOps, main, master ]
  pull_request:
    branches: [ DevOps, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build with Maven
        run: mvn -B -e -DskipTests clean verify

      - name: Run Tests
        run: mvn -B test
