name: e2e

on:
  pull_request:
  push:
    branches: [DevOps]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Test@123
          MYSQL_DATABASE: bankappdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pTest@123"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/bankappdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build app
        run: mvn -B -q -DskipTests package

      - name: Start app
        run: |
          nohup java -jar target/bankapp-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/login && exit 0; sleep 2; done
          cat app.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Run manual-plan regression suite
        working-directory: e2e
        run: npx playwright test

      - name: Coverage matrix
        if: always()
        working-directory: e2e
        run: |
          npm run matrix
          cat ../qa/coverage-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and failure videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            qa/coverage-matrix.md
            app.log
          retention-days: 30
