name: E2E regression (Playwright + MySQL 8)

on:
  pull_request:
  push:
    branches: [main, master, demo/qa-live-before]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mirror.gcr.io/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Test@123
          MYSQL_DATABASE: bankappdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pTest@123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/bankappdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Test@123
      MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Coverage matrix accounts for all plan rows
        working-directory: e2e
        run: npm run coverage:check

      - name: Type-check specs
        working-directory: e2e
        run: npx tsc -p .

      - name: Build and unit test against MySQL 8
        run: ./mvnw -B -s demo/maven-settings.xml verify

      - name: Start app
        run: |
          mkdir -p logs
          setsid nohup java -jar target/bankapp-0.0.1-SNAPSHOT.jar > logs/app.log 2>&1 < /dev/null &
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:8080/login && exit 0
            sleep 1
          done
          echo "App did not serve /login within 120s"; tail -n 80 logs/app.log; exit 1

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression
        working-directory: e2e
        run: npx playwright test

      - name: Publish coverage matrix with results
        if: always()
        working-directory: e2e
        run: |
          if [ -f results.json ]; then
            node scripts/coverage.mjs --results results.json | tee coverage-matrix-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Playwright did not produce results.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/results.json
            e2e/coverage-matrix-results.md
            logs/app.log
          retention-days: 14
