version: "3.8"
services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD (see .env.example)}
      - MYSQL_ROOT_HOST=localhost
      - MYSQL_DATABASE=BankDB
      - MYSQL_USER=bankapp
      - MYSQL_PASSWORD=${BANKAPP_DB_PASSWORD:?set BANKAPP_DB_PASSWORD (see .env.example)}
    volumes:
      - bankapp-volume:/var/lib/mysql
    networks:
      - bankapp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mainapp:
    image: ${DUSER}/${IMAGE}
    container_name: Bankapp
    environment:
      - SPRING_DATASOURCE_USERNAME=bankapp
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/BankDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_PASSWORD=${BANKAPP_DB_PASSWORD:?set BANKAPP_DB_PASSWORD (see .env.example)}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bankapp
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  bankapp:

volumes:
    bankapp-volume: