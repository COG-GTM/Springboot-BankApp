version: "3.8"
services:
  mysql:
    # Pinned to a version and the multi-arch index digest so the database
    # image cannot change without a commit to this file.
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=Test@123
      - MYSQL_DATABASE=BankDB
    volumes:
      - bankapp-volume:/var/lib/mysql
    networks:
      - bankapp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mainapp:
    # DUSER must be a registry namespace your organisation controls and TAG an
    # explicit release tag (optionally pinned as TAG=<tag>@sha256:<digest>).
    # Compose refuses to start when either is missing; see .env.
    image: ${DUSER:?set DUSER to a registry namespace your organisation controls}/${IMAGE:-bankapp}:${TAG:?set TAG to an explicit image tag, optionally tag@sha256 digest}
    container_name: Bankapp
    environment:
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/BankDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_PASSWORD=Test@123
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bankapp
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  bankapp:

volumes:
    bankapp-volume: