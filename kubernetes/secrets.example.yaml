# TEMPLATE ONLY - do not commit real credentials.
#
# The mysql-secret used by mysql-deployment.yml and bankapp-deployment.yml is NOT
# stored in Git. Create it in the cluster with one of the following:
#
#   1. External Secrets Operator (recommended, GitOps friendly):
#        kubectl apply -f external-secret.yaml
#
#   2. Directly from your secret manager / CI, e.g.:
#        kubectl create secret generic mysql-secret \
#          --namespace bankapp-namespace \
#          --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
#          --from-literal=SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD"
#
#   3. Copy this file to secrets.yaml (git-ignored), fill in the values and apply it.
#      Kubernetes Secrets are only base64 encoded, never store a filled-in copy in Git.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bankapp-namespace
type: Opaque
stringData:
  # Password of the MySQL root account (administrative use only).
  MYSQL_ROOT_PASSWORD: "<replace-me>"
  # Password of the least-privilege application account (bankapp) used by the app.
  SPRING_DATASOURCE_PASSWORD: "<replace-me>"
