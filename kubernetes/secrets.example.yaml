# TEMPLATE ONLY - do not commit real credentials.
#
# Kubernetes Secrets are base64-encoded, not encrypted, so a populated copy of this file
# must never be checked in. Create the Secret out-of-band instead:
#
#   kubectl create secret generic mysql-secret \
#     --namespace bankapp-namespace \
#     --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
#     --from-literal=SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD"
#
# or source it from a secret manager (External Secrets Operator, Sealed Secrets,
# AWS Secrets Manager CSI driver, ...).
#
# If you render this template locally, write it to kubernetes/secrets.yaml, which is
# git-ignored.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bankapp-namespace
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "<replace-me>"
  SPRING_DATASOURCE_PASSWORD: "<replace-me>"
