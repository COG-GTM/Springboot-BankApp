# Template only — this file contains no credentials and is NOT applied by CD.
#
# The real `mysql-secret` is created out-of-band from the platform secret store
# (ITGC-SEC-06), for example:
#
#   kubectl create secret generic mysql-secret \
#     --namespace bankapp-namespace \
#     --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
#     --from-literal=SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD"
#
# or by an External Secrets Operator / Sealed Secrets resource that references the
# organisation's secret manager. Nothing in this repository may hold the plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bankapp-namespace
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "<injected at deploy time>"
  SPRING_DATASOURCE_PASSWORD: "<injected at deploy time>"
