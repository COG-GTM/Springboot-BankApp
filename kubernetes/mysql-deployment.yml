apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bankapp-namespace
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate  # the data dir is single-writer; stop the old pod before starting the new one
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # Runs MySQL as a non-root UID. The data directory must be writable by it:
      # fsGroup covers dynamically provisioned volumes; for the hostPath PV create
      # the subPath dir first (kubelet would create it root-owned) on the node once:
      # `mkdir -p /mnt/data/mysql/mysql-data && chown -R 10001:10001 /mnt/data/mysql`
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: mysql
        image: mysql:8.0  # Use a specific, stable version for production
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: bankapp-config
              key: MYSQL_DATABASE
        startupProbe:  # allows up to 5 min for first start before liveness applies
          tcpSocket:
            port: 3306
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: mysql-pv-storage
          mountPath: /var/lib/mysql
          subPath: mysql-data  # Optional: Ensure a subdirectory is used for better volume organization
        - name: mysql-run  # writable dirs needed with a read-only root filesystem
          mountPath: /var/run/mysqld
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: mysql-pv-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: mysql-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}

