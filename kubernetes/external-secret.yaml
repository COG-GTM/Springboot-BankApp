# Pulls the database credentials from AWS Secrets Manager at deploy time so that no
# credential material lives in Git. Requires the External Secrets Operator:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace
#
# The referenced AWS secret (bankapp/mysql) must hold a JSON document:
#   {"MYSQL_ROOT_PASSWORD": "...", "SPRING_DATASOURCE_PASSWORD": "..."}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: bankapp-secret-store
  namespace: bankapp-namespace
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            # IRSA service account allowed to read only the bankapp/mysql secret.
            name: bankapp-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-secret
  namespace: bankapp-namespace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bankapp-secret-store
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: bankapp/mysql
        property: MYSQL_ROOT_PASSWORD
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: bankapp/mysql
        property: SPRING_DATASOURCE_PASSWORD
